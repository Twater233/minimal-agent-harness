[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent-harness"
version = "0.1.0"
description = "A small, persistent, framework-free tool-calling agent"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
mini-agent = "agent_harness.cli:main"

[tool.setuptools.packages.find]
include = ["agent_harness*"]
